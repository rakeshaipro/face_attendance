[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-attendance"
version = "0.1.0"
description = "Face Recognition Attendance System — backend"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # DB
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Scheduling / background
    "apscheduler>=3.10",
    # HTTP client (webhooks, batch sync)
    "httpx>=0.27",
    # Crypto (camera credential encryption, §3.13.9)
    "cryptography>=42",
    # Computer vision / face recognition (§3.3, §3.4)
    "opencv-python>=4.9",
    "numpy>=1.26",
    # Spreadsheet export (§3.9.4 XLSX)
    "openpyxl>=3.1",
    # insightface + onnxruntime are optional — see README. They often lag
    # the latest CPython, so we do not pin them in the core deps. Install
    # separately:  pip install insightface onnxruntime
]

[project.optional-dependencies]
ml = [
    "insightface>=0.7",
    "onnxruntime>=1.17",
]
gpu = [
    "insightface>=0.7",
    "onnxruntime-gpu>=1.17",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
face-attendance = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "camera: tests that require a reachable IP camera (skipped by default)",
]
